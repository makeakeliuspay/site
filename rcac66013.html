<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Private</title>
<style>
  :root{
    --bg:#1a1a1a; --panel:#232323; --panel2:#2b2b2b;
    --text:#f0ece0; --muted:#9a958a; --accent:#e63a1e; --done:#3fae5a; --line:#3a3a3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:0 0 60px;line-height:1.35;min-height:100vh}
  body.dragging-active{touch-action:none;user-select:none}
  /* lock screen */
  #lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px}
  #lock h2{margin:0;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  #lock input{width:100%;max-width:280px;background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:13px 14px;font-size:16px}
  #lock input:focus{outline:none;border-color:var(--accent)}
  #lock button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:700}
  #lock .err{color:var(--accent);font-size:13px;min-height:16px}
  /* app */
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 12px}
  h1{margin:0;font-size:20px;letter-spacing:.02em;font-weight:800}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .barwrap{margin-top:10px;background:var(--panel2);border-radius:20px;height:10px;overflow:hidden}
  .bar{height:100%;width:0;background:var(--done);transition:width .25s}
  .statusrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
  .count{font-size:14px;font-weight:600}.count b{color:var(--done)}
  button.reset{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px}
  button.reset:active{background:var(--panel2)}
  .route{margin:12px 12px 0;border:1px solid var(--line);border-radius:14px;background:#1f1f1f;overflow:hidden}
  .route.dragging{border-color:var(--accent);box-shadow:0 8px 22px rgba(0,0,0,.5);opacity:.96}
  .rhead{display:flex;align-items:center;gap:10px;padding:12px}
  .grip{flex:0 0 auto;width:30px;height:38px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 6px;cursor:grab;touch-action:none}
  .grip span{display:block;height:2px;background:var(--muted);border-radius:2px}
  .route.dragging .grip{cursor:grabbing}
  .rtitle{flex:1 1 auto;min-width:0;cursor:pointer}
  .rname{font-size:14px;font-weight:700;letter-spacing:.02em}.rname .tnum{color:var(--accent)}
  .rmeta{flex:0 0 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .chev{flex:0 0 auto;color:var(--muted);font-size:13px;transition:transform .18s;cursor:pointer;padding:0 4px}
  .route.collapsed .chev{transform:rotate(-90deg)}
  .body{padding:0 12px 4px}.route.collapsed .body{display:none}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 10px;line-height:1.3}
  .card{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px}
  .card.done{background:#1e2a1f;border-color:#2c4a30}
  .step{flex:0 0 auto;width:20px;text-align:center;color:var(--muted);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .card.done .step{color:var(--done)}
  .check{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:transparent}
  .card.done .check{background:var(--done);border-color:var(--done)}
  .mid{flex:1 1 auto;min-width:0}
  .addr{color:var(--text);text-decoration:none;font-size:16px;font-weight:600;display:block}
  .card.done .addr{color:#cfe6d2}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .pin{flex:0 0 auto;width:44px;height:44px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none}
  .pin:active{background:#3a3a3a}
  .stamp{color:var(--done);font-size:12px;margin-top:2px;display:none}.card.done .stamp{display:block}
  .foot{color:var(--muted);font-size:12px;text-align:center;padding:22px 24px 0}
</style>
</head>
<body>
<div id="lock">
  <h2>Enter password</h2>
  <input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
  <button id="go">Unlock</button>
  <div class="err" id="err"></div>
</div>
<div id="app-root"></div>

<script>
/* ---- encrypted payload (filled in by the lock tool) ---- */

function b64d(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }

async function unlock(pw){
  const enc=new TextEncoder();
  const keyMat=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64d(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},
    keyMat,{name:"AES-GCM",length:256},false,["decrypt"]);
  const ptBuf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(ENC.iv)},key,b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(ptBuf));
}

document.getElementById("go").addEventListener("click", tryUnlock);
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
async function tryUnlock(){
  const err=document.getElementById("err"); err.textContent="";
  const pw=document.getElementById("pw").value;
  if(!pw) return;
  try{
    const data=await unlock(pw);
    startApp(data);
  }catch(e){
    err.textContent="Wrong password.";
    document.getElementById("pw").value="";
  }
}

/* ---- the route tool (runs only after the password decrypts the data) ---- */
let ROUTES=[], BUILDINGS=[], state=null;
const KEY="map_route_state_v2";
let DEFAULT_ORDER=[];

function startApp(data){
  ROUTES=data.routes; BUILDINGS=data.buildings;
  DEFAULT_ORDER=ROUTES.map(r=>r.key);
  document.getElementById("lock").style.display="none";
  document.getElementById("app-root").innerHTML=`
    <header>
      <h1>Make <span>Akelius</span> Pay · Routes</h1>
      <div class="sub" id="daysub">-</div>
      <div class="barwrap"><div class="bar" id="bar"></div></div>
      <div class="statusrow">
        <div class="count"><b id="doneN">0</b> / <span id="totN">0</span> covered</div>
        <button class="reset" id="newday">Start a new day</button>
      </div>
    </header>
    <main id="app"></main>
    <div class="foot">Drag the <b>≡</b> handle to reorder routes · tap a route to collapse it.<br>Tap an <b>address</b> for Maps, tap the <b>box</b> to mark it covered. Saved on this phone only.</div>`;
  document.getElementById("newday").addEventListener("click", newDay);
  state=load();
  render();
}

function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||typeof s!=="object") s={};
  if(!s.checked) s.checked={};
  if(!s.dayStarted) s.dayStarted=Date.now();
  let order=Array.isArray(s.order)?s.order.filter(k=>DEFAULT_ORDER.includes(k)):[];
  DEFAULT_ORDER.forEach(k=>{ if(!order.includes(k)) order.push(k); });
  s.order=order; if(!s.collapsed) s.collapsed={};
  return s;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function mapsUrl(a){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a+", Montréal, QC"); }
const routeByKey=k=>ROUTES.find(r=>r.key===k);

function render(){
  document.getElementById("daysub").textContent="Day started: "+fmtDate(state.dayStarted);
  const app=document.getElementById("app"); app.innerHTML="";
  state.order.forEach((key,ri)=>{
    const r=routeByKey(key); if(!r) return;
    const items=BUILDINGS.filter(b=>b.route===key);
    const doneZ=items.filter(b=>state.checked[b.id]).length;
    const collapsed=!!state.collapsed[key];
    const sec=document.createElement("section");
    sec.className="route"+(collapsed?" collapsed":""); sec.dataset.key=key;
    let cards="";
    items.forEach((b,i)=>{
      const done=!!state.checked[b.id];
      cards+=`<div class="card${done?" done":""}" data-id="${b.id}">
        <div class="step">${i+1}</div>
        <div class="check" role="checkbox" tabindex="0" aria-checked="${done}">${done?"✓":""}</div>
        <div class="mid">
          <a class="addr" href="${mapsUrl(b.addr)}" target="_blank" rel="noopener">${b.addr}</a>
          <div class="meta">${b.note||"&nbsp;"}</div>
          <div class="stamp">Covered ${done?fmtTime(state.checked[b.id]):""}</div>
        </div>
        <a class="pin" href="${mapsUrl(b.addr)}" target="_blank" rel="noopener" aria-label="Open in Maps">📍</a>
      </div>`;
    });
    sec.innerHTML=`
      <div class="rhead">
        <div class="grip" aria-label="Drag to reorder"><span></span><span></span><span></span></div>
        <div class="rtitle"><div class="rname"><span class="tnum">Route ${ri+1}</span> : ${r.name}</div></div>
        <div class="rmeta">${doneZ}/${items.length}</div>
        <div class="chev">▾</div>
      </div>
      <div class="body"><div class="hint">${r.hint}</div>${cards}</div>`;
    sec.querySelector(".grip").addEventListener("pointerdown", e=>startDrag(e,sec));
    const t=()=>toggleCollapse(key);
    sec.querySelector(".rtitle").addEventListener("click", t);
    sec.querySelector(".chev").addEventListener("click", t);
    sec.querySelectorAll(".card").forEach(c=> c.querySelector(".check").addEventListener("click", ()=>toggleCheck(c.dataset.id)));
    app.appendChild(sec);
  });
  const done=Object.keys(state.checked).length;
  document.getElementById("doneN").textContent=done;
  document.getElementById("totN").textContent=BUILDINGS.length;
  document.getElementById("bar").style.width=(done/BUILDINGS.length*100)+"%";
}
function toggleCheck(id){ if(state.checked[id]) delete state.checked[id]; else state.checked[id]=Date.now(); save(); render(); }
function toggleCollapse(key){ state.collapsed[key]=!state.collapsed[key]; save(); const s=document.querySelector(`.route[data-key="${key}"]`); if(s) s.classList.toggle("collapsed",state.collapsed[key]); }
function newDay(){ if(Object.keys(state.checked).length && !confirm("Start a new day? This clears today's check-offs. (Your route order stays.)")) return; state.checked={}; state.dayStarted=Date.now(); save(); render(); }

let drag=null;
function startDrag(e,sec){ e.preventDefault(); drag={sec}; sec.classList.add("dragging"); document.body.classList.add("dragging-active");
  window.addEventListener("pointermove",onDragMove); window.addEventListener("pointerup",endDrag,{once:true}); window.addEventListener("pointercancel",endDrag,{once:true}); }
function onDragMove(e){ if(!drag) return; e.preventDefault(); const app=document.getElementById("app"); const secs=[...app.querySelectorAll(".route")]; const y=e.clientY;
  for(const other of secs){ if(other===drag.sec) continue; const rect=other.getBoundingClientRect(); if(y>rect.top && y<rect.bottom){ const before=y<rect.top+rect.height/2; app.insertBefore(drag.sec, before?other:other.nextSibling); break; } } }
function endDrag(){ if(!drag) return; drag.sec.classList.remove("dragging"); document.body.classList.remove("dragging-active"); window.removeEventListener("pointermove",onDragMove);
  const app=document.getElementById("app"); state.order=[...app.querySelectorAll(".route")].map(s=>s.dataset.key); save(); drag=null; render(); }
</script>
</body>
</html>
